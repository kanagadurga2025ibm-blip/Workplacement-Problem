<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Placement Portal</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header>
        <h1>Job Placement Portal</h1>
        <p>Find your dream job or post a new opportunity!</p>
    </header>

    <main>
        <section class="search-section">
            <input type="text" id="searchInput" placeholder="Search jobs by title or location..." />
        </section>

        <section class="job-list" id="jobList">
            <!-- Jobs will be dynamically added here -->
        </section>

        <section class="post-job">
            <h2>Post a Job</h2>
            <form id="jobForm">
                <input type="text" id="jobTitle" placeholder="Job Title" required />
                <input type="text" id="companyName" placeholder="Company Name" required />
                <input type="text" id="location" placeholder="Location" required />
                <textarea id="description" placeholder="Job Description" required></textarea>
                <button type="submit">Add Job</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2025 Job Placement Portal | Made with ❤️ using HTML, CSS & JS</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
